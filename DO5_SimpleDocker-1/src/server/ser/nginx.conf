user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    sendfile        on;
    #tcp_nopush     on;
    server {
        listen  8080;
        # listen 81;
        location / {
            # fastcgi_pass 127.0.0.1:8080;
            proxy_pass http://server:81;
        }
        location /status {
            stub_status on;
        }
    }
    #gzip  on;

    keepalive_timeout  65;
}
