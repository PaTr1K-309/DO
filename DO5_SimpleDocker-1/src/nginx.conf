user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    sendfile        on;
    #tcp_nopush     on;
    server {
        listen  80;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
        location /status {
            stub_status on;
        }
    }
    #gzip  on;

    keepalive_timeout  65;
}
